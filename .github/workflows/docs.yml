name: Docs site

# Builds the mkdocs-material site and deploys it to GitHub Pages.
# Requires repo Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "runbooks/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-docs.in"
      - "scripts/docs-build.sh"
      - "scripts/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  # The strict build must gate PRs too: without this, broken links/nav merge green
  # and only fail during the Pages deploy from main.
  pull_request:
    paths:
      - "docs/**"
      - "runbooks/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-docs.in"
      - "scripts/docs-build.sh"
      - "scripts/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install --require-hashes -r requirements-docs.txt
      # docs-build.sh build runs mkdocs --strict, so broken links or nav drift fail the deploy.
      - run: ./scripts/docs-build.sh build
      - name: Publish version into retained documentation tree
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          had_docs_branch=false
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            had_docs_branch=true
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            ./scripts/docs-build.sh mike deploy --branch gh-pages --push --update-aliases "$version" latest
            ./scripts/docs-build.sh mike set-default --branch gh-pages --push latest
          else
            ./scripts/docs-build.sh mike deploy --branch gh-pages --push --update-aliases development
            if [[ "$had_docs_branch" == "false" ]]; then
              ./scripts/docs-build.sh mike set-default --branch gh-pages --push development
            fi
          fi
          git fetch origin gh-pages
          rm -rf versioned-site
          mkdir -p versioned-site
          git archive origin/gh-pages | tar -x -C versioned-site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: versioned-site

  # Pages can retain the earlier main artifact when a tag shares its SHA.
  # Keep the tag's generated version above, then publish the retained tree from
  # main through workflow_dispatch. This preserves the release's source content.
  # https://github.com/actions/deploy-pages/issues/383
  release-dispatch:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch publication of the retained documentation tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
