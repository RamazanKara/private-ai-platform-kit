name: OpenSSF Scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches:
      - main

# Least privilege: read-only by default. The one job escalates only to what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # checkout
      actions: read           # Scorecard reads workflow-run metadata for its checks
      security-events: write  # upload the SARIF results
      id-token: write         # canonical scorecard-action permission; kept job-scoped, not workflow-wide
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: scorecard-results.sarif
