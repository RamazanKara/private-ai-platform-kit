name: OpenSSF Scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches:
      - main

# Least privilege: read-only by default. The one job escalates only to what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # checkout
      actions: read           # Scorecard reads workflow-run metadata for its checks
      security-events: write  # upload the SARIF results
      id-token: write         # canonical scorecard-action permission; kept job-scoped, not workflow-wide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
