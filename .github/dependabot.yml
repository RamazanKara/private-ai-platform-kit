version: 2
# Dependabot edits the requirement inputs (*.txt / *.in) but cannot regenerate the
# hash-pinned locks. `make dependency-lock-check` fails such a PR on purpose; push
# `make relock` output to the Dependabot branch before merging.
updates:
  # GitHub Actions: keeps SHA-pinned `uses:` refs current via the trailing
  # version comment on each pin.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, github_actions]
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Repository tooling: quality, docs, and SDK build/test locks.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies, python]
    groups:
      tooling-minor-patch:
        update-types:
          - minor
          - patch

  # Both services pin identical runtime versions; one grouped PR keeps them in step.
  - package-ecosystem: pip
    directories:
      - "/src/inference-gateway"
      - "/src/rag-service"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    labels: [dependencies, python]
    groups:
      services-minor-patch:
        update-types:
          - minor
          - patch

  # Base-image digests for the two service Dockerfiles.
  - package-ecosystem: docker
    directories:
      - "/src/inference-gateway"
      - "/src/rag-service"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    labels: [dependencies, docker]
    groups:
      base-images:
        patterns: ["*"]
