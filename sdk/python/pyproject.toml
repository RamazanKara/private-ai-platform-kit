[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-ai-platform-kit-client"
version = "0.29.0"
description = "Typed, dependency-light Python client for the Private AI Platform Kit inference gateway."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Private AI Platform Kit maintainers" }]
keywords = ["llm", "gateway", "openai-compatible", "anthropic", "kubernetes", "private-ai", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/RamazanKara/private-ai-platform-kit"
Documentation = "https://ramazankara.github.io/private-ai-platform-kit/"
Source = "https://github.com/RamazanKara/private-ai-platform-kit"
Changelog = "https://github.com/RamazanKara/private-ai-platform-kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# One package; py.typed marks the inline annotations for type checkers (PEP 561).
packages = ["ai_platform_client"]

[tool.hatch.build.targets.sdist]
include = ["ai_platform_client", "tests", "README.md"]
