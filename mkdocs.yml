site_name: Private AI Platform Kit
site_description: Self-hosted LLM gateway, retrieval, and coding-agent workspaces for Kubernetes, with a verifiable record of every model call and agent action.
site_url: https://ramazankara.github.io/private-ai-platform-kit/
repo_url: https://github.com/RamazanKara/private-ai-platform-kit
repo_name: RamazanKara/private-ai-platform-kit
edit_uri: edit/main/docs/
copyright: Maintained by fluentorbit as project steward. Licensed under Apache-2.0.

# Runbooks live at the repo-root runbooks/ (their paths are gate-referenced and shipped in
# live Prometheus alert runbook_url annotations). scripts/docs-build.sh copies them into
# docs/runbooks/ at build time so they are searchable and linkable from the site without
# moving the source of truth. docs/runbooks/ is git-ignored.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

extra:
  version:
    provider: mike

# Repairs the edit link on mirrored runbook pages so it targets runbooks/ (the source
# of truth) instead of the git-ignored build-time copy under docs/runbooks/.
hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # Renders Material icon shortcodes like :material-link-lock: as inline SVG
  # (the landing-page grid-card icons).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# docs/README.md is a GitHub-browse map (repo-relative links validated by repo-hygiene) that
# duplicates the site landing page; keep it out of the built site. The leading slash anchors the
# pattern to the docs root so runbooks/README.md (the Runbooks nav page) is not excluded.
exclude_docs: |
  /README.md

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Call the API: client-examples.md
      - Is it a fit?: decision-guide.md
      - FAQ: faq.md
  - Guides:
      - Local lab and operations: getting-started.md
      - Customer cluster handoff: customer-handoff-example.md
      - Restricted-egress tenant: regulated-offline-tenant-example.md
      - GPU coding-agent tenant: gpu-coding-agent-tenant-example.md
      - Developer workflow: development.md
      - Runbooks: runbooks/README.md
  - Concepts:
      - Architecture: architecture.md
      - Security overview: security-overview.md
      - Threat model: threat-model.md
      - Agent-sandbox integration: agent-sandbox-integration.md
      - OWASP LLM Top 10 mapping: owasp-llm-top-10-mapping.md
      - AI governance crosswalk: ai-governance-crosswalk.md
      - Scope and non-goals: scope-and-non-goals.md
      - Architecture decisions: adr/README.md
  - Reference:
      - Feature inventory: feature-inventory.md
      - Repository map: repository-map.md
      - Model selection: model-selection.md
      - Production readiness: production-readiness.md
      - Evidence and strict validation: proof.md
      - Benchmarks and evals: benchmarks-and-evals.md
      - Capacity and sizing: capacity-sizing.md
      - Cost model: cost-model.md
      - Version matrix: version-matrix.md
      - Release verification: release-verification.md
      - Distribution: distribution.md
      - Glossary: glossary.md
      - Upstream references: references.md
