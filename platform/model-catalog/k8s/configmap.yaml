apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-model-catalog
  namespace: inference
  labels:
    app.kubernetes.io/name: ai-model-catalog
    app.kubernetes.io/part-of: private-ai-platform-kit
    platform.ai/cost-center: platform
    platform.ai/environment: local
    platform.ai/owner: platform-team
    platform.ai/sandbox-id: local-lab
data:
  models.yaml: |
    apiVersion: platform.ai/v1alpha1
    kind: ModelCatalog
    metadata:
      name: private-ai-platform-kit-models
    spec:
      models:
        - id: Qwen/Qwen3-Coder-Next
          runtime: vllm
          owner: platform-team
          status: approved
          stage: customer-lab
          riskTier: medium
          dataClassification: internal
          license: apache-2.0
          source: huggingface
          accelerators:
            - nvidia
            - amd
          contextWindow: 262144
          maxPromptChars: 131072
          maxCompletionTokens: 8192
          estimatedCharsPerToken: 3
          promotionRequest: platform/model-catalog/promotion-requests/qwen3-coder-customer-lab-approved.yaml
          modelCard: platform/model-catalog/model-cards/qwen3-coder.md
          notes: Current Qwen3 Coder Next profile for customer GPU coding-agent clusters.
        - id: qwen2.5:0.5b
          runtime: ollama
          owner: platform-team
          status: approved
          stage: local-lab
          riskTier: low
          dataClassification: internal
          license: apache-2.0
          source: ollama-library
          accelerators:
            - cpu
          contextWindow: 32768
          maxPromptChars: 8192
          maxCompletionTokens: 1024
          estimatedCharsPerToken: 4
          promotionRequest: platform/model-catalog/promotion-requests/qwen2.5-local-lab-approved.yaml
          modelCard: platform/model-catalog/model-cards/qwen2.5-0.5b.md
          notes: Default local CPU smoke model; fast non-reasoning Qwen2.5 0.5B sized for laptop kind demos.
        - id: qwen3.5:0.8b
          runtime: ollama
          owner: platform-team
          status: approved
          stage: customer-lab
          riskTier: low
          dataClassification: internal
          license: apache-2.0
          source: ollama-library
          accelerators:
            - cpu
          contextWindow: 32768
          maxPromptChars: 8192
          maxCompletionTokens: 1024
          estimatedCharsPerToken: 4
          promotionRequest: platform/model-catalog/promotion-requests/qwen3.5-customer-lab-approved.yaml
          modelCard: platform/model-catalog/model-cards/qwen3.5-0.8b.md
          notes: Higher-quality small Qwen3.5 reasoning model for the customer Ollama profile; reasons slowly on CPU, so the local laptop profile uses qwen2.5:0.5b instead.
        # Embedding model for RAG retrieval. Retrieval-quality models are now governed in the
        # catalog like generation models (the previous asymmetry the audit flagged). 384-dim
        # matches the RAG default vector dimensions; serve via vLLM embedding mode (--task embed)
        # or a TEI sidecar, and point the RAG service at it (retrieval.embedding.provider=
        # openai-compatible). Approved with a promotion request; the provenance entry uses a
        # pinned upstream commit and safetensors checksum inventory.
        - id: BAAI/bge-small-en-v1.5
          runtime: vllm
          owner: platform-team
          status: approved
          stage: customer-lab
          riskTier: low
          dataClassification: internal
          license: mit
          source: huggingface
          accelerators:
            - nvidia
            - cpu
          modality: embedding
          contextWindow: 512
          maxPromptChars: 2048
          maxCompletionTokens: 1
          estimatedCharsPerToken: 4
          promotionRequest: platform/model-catalog/promotion-requests/bge-small-embedding-approved.yaml
          modelCard: platform/model-catalog/model-cards/bge-small-en.md
          notes: Approved reference embedding model (384-dim) for governed RAG retrieval; replaces the demo hashed-vector default. maxCompletionTokens is nominal (embeddings produce vectors, not completions).
        # Upstream metadata reviewed 2026-09-23. Candidates are not approved or allowlisted.
        - id: Qwen/Qwen3.6-35B-A3B
          runtime: vllm
          owner: platform-team
          status: proposed
          stage: customer-lab
          riskTier: medium
          dataClassification: internal
          license: apache-2.0
          source: huggingface
          accelerators:
            - nvidia
            - amd
          contextWindow: 262144
          maxPromptChars: 131072
          maxCompletionTokens: 8192
          estimatedCharsPerToken: 3
          upstream:
            modelCard: https://huggingface.co/Qwen/Qwen3.6-35B-A3B/blob/995ad96eacd98c81ed38be0c5b274b04031597b0/README.md
            revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
            reviewedAt: '2026-09-23'
          notes: Existing 35B/3B-active comparison candidate. Upstream context is confirmed; requires model-specific
            runtime and hardware evaluation.
        - id: Qwen/Qwen3.8-27B
          runtime: vllm
          owner: platform-team
          status: proposed
          stage: customer-lab
          riskTier: medium
          dataClassification: internal
          license: apache-2.0
          source: huggingface
          accelerators:
            - nvidia
            - amd
          contextWindow: 262144
          maxPromptChars: 131072
          maxCompletionTokens: 8192
          estimatedCharsPerToken: 3
          upstream:
            modelCard: https://huggingface.co/Qwen/Qwen3.8-27B/blob/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/README.md
            revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
            reviewedAt: '2026-09-23'
          notes: Current dense Qwen candidate for text and coding evaluation. Upstream supports vision; the kit
            does not claim that modality or real-model evaluation.
        - id: Qwen/Qwen3.8-Flash-Next
          runtime: vllm
          owner: platform-team
          status: proposed
          stage: customer-lab
          riskTier: medium
          dataClassification: internal
          license: LicenseRef-Qwen-Community-1.0
          source: huggingface
          accelerators:
            - nvidia
          contextWindow: 262144
          maxPromptChars: 131072
          maxCompletionTokens: 8192
          estimatedCharsPerToken: 3
          upstream:
            modelCard: https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/de4b8e4d43b917e7706784d8bb445c9af86a3540/README.md
            revision: de4b8e4d43b917e7706784d8bb445c9af86a3540
            reviewedAt: '2026-09-23'
          notes: Architecture-specific large MoE candidate. Custom Qwen Community 1.0 license, not Apache-2.0;
            runtime compatibility, license review, and GPU evaluation remain required.
        - id: zai-org/GLM-5.3-Flash
          runtime: vllm
          owner: platform-team
          status: proposed
          stage: customer-lab
          riskTier: medium
          dataClassification: internal
          license: mit
          source: huggingface
          accelerators:
            - nvidia
          contextWindow: 1048576
          maxPromptChars: 131072
          maxCompletionTokens: 8192
          estimatedCharsPerToken: 3
          upstream:
            modelCard: https://huggingface.co/zai-org/GLM-5.3-Flash/blob/eb9eb208eb0d988989d07a6a12d0fdeb5f52574a/README.md
            revision: eb9eb208eb0d988989d07a6a12d0fdeb5f52574a
            reviewedAt: '2026-09-23'
          notes: Current GLM Flash candidate, 320B total/18B active. Requires the upstream serving recipe and
            multi-GPU evaluation; not enabled in gateway allowlists.
        - id: deepseek-ai/DeepSeek-V4.1-Flash
          runtime: vllm
          owner: platform-team
          status: proposed
          stage: customer-lab
          riskTier: medium
          dataClassification: internal
          license: mit
          source: huggingface
          accelerators:
            - nvidia
          contextWindow: 1048576
          maxPromptChars: 131072
          maxCompletionTokens: 8192
          estimatedCharsPerToken: 3
          upstream:
            modelCard: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/dba1be0a40aa45a94ad051997016db3960a90277/README.md
            revision: dba1be0a40aa45a94ad051997016db3960a90277
            reviewedAt: '2026-09-23'
          notes: Current DeepSeek Flash candidate with a 552B backbone and specialized serving requirements. Context
            records upstream configuration, not validated capacity in this kit.
